[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rebot_taccap_identification"
version = "0.1.0"
description = "Mass and centre of mass identification of the reBot B601 (RobStride) arm and its payload, from static torques"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "XenseRobotics-AI" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26", "scipy>=1.11.2",
  "motorbridge>=0.5.6",                                   # RobStride motors over CAN
  "PySide6>=6.5", "pyqtgraph>=0.13", "PyOpenGL>=3.1",     # workbench
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rebot_taccap_identification = "rebot_taccap_identification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rebot_taccap_identification = ["robots/*/urdf/**/*.urdf", "robots/*/urdf/**/*.STL", "robots/*/urdf/**/*.stl",
              "robots/*/urdf/*/sources.json", "robots/*/urdf/*/LICENSES/*", "robots/*/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
